name: Bug report
description: Something in WhiteRose doesn't work the way it should
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: WhiteRose version
      description: >-
        In Settings › About, next to Desktop (Copy puts it on the clipboard).
        Reports from a version older than the newest release are closed
        automatically: update first (Settings › Updates) and check it still happens.
      placeholder: 0.3.0-alpha.3
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: >-
        Filled in when you report from WhiteRose (SUPER+SHIFT+B, or Settings ›
        About › Report a problem). Reports from builds that don't match a
        release, forks included, are closed automatically: report those to
        whoever made the build.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open Settings › Displays
        2. Drag the second screen to the left
        3. The bar moves to the wrong screen
  - type: textarea
    id: system
    attributes:
      label: System
      description: Filled in by WhiteRose (version, distribution, hardware, what was open).
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: >-
        Drag in the whiterose-report-….txt file WhiteRose saved in Downloads
        (it opens in Files next to this page).
