name: bug report checks

# Bug reports are closed with a short note when they didn't come from an
# official build (their build ID isn't in the release's signed SHA256SUMS:
# forks and rebuilt builds report to whoever made them), or come from a
# version older than the newest release (Settings › Updates › Releases
# warns about that before switching back). The rules are in
# .github/scripts/old-version.js.
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/old-version.js`);
            await run({ github, context });
