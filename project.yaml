# WhiteRose's version and release history. `make release` builds and
# publishes `version`, with its entry below as the release notes;
# `make changelog` writes CHANGELOG.md from every entry.
#
# version: 0.2.0, or a pre-release such as 0.6.0-alpha.12 (published on
# GitHub as a pre-release). Looser spellings are tidied: v0.6-alpha-12 is
# 0.6.0-alpha.12.
#
# Each release: version, date (YYYY-MM-DD), title, summary, then any of
# added / changed / fixed / removed (lists), contributors (GitHub
# usernames) and notes (Markdown). Newest first. What's added comes
# first in the notes: Settings › Updates shows a release's first few
# points.

name: WhiteRose
repo: BlueBeard63/WhiteRose
version: 0.3.0-alpha.1

releases:
  - version: 0.3.0-alpha.1
    date: 2026-11-12
    title: Layouts (alpha)
    summary: >-
      A first look at 0.3 Layouts, for trying out: windows can tile themselves, snap to edges and zones, follow per-app rules, and drop down as scratchpads. Expect rough edges; the in-app updater stays on full releases, so this is installed by hand.
    added:
      - "Tiling: dwindle and master-stack layouts with gaps, chosen for everything and overridden per workspace or monitor (Settings › Windows, SUPER+T, or the button on the bar)"
      - "Tabbed groups: several windows in one tile with a tab strip (SUPER+G, SUPER+. and SUPER+,)"
      - "Snapping: drag a floating window to an edge or corner, or pick a layout from SUPER+Z, a drag to the top, or a WhiteRose app's maximise button"
      - "Snap zones: your own grid per monitor or per workspace, used with SHIFT while dragging; edit it in Settings › Snapping or at full size on the monitor, with the tools in the island"
      - "Window rules: by app and title, open a window on a workspace or monitor, floating or tiled, at a size, in a snap zone, see-through or always on top (Settings › Window rules)"
      - "Scratchpads: apps shown and hidden with a key, sliding down from the island, like a drop-down terminal (Settings › Scratchpads)"
      - "Keyboard control of tiles: focus, move and resize with SUPER and the arrows, SUPER+R to resize, SUPER+J to flip a split, SUPER+M to make master"
    changed:
      - "The window switcher is SUPER+TAB (was SUPER+ALT+TAB); ALT+TAB still switches apps"
      - "Settings fits narrow windows: the sidebar folds away and pages reflow"
      - "Sharper bar icons"
    fixed:
      - "A panel or overlay layer could be drawn under one in a lower layer that opened after it"
    notes: |
      Install it with this release's `install.sh` (it installs this version, checked against the release key). Your settings carry over, and moving to 0.3.0 when it's out is a normal update.
    contributors: [BlueBeard63]

  - version: 0.2.1
    date: 2026-11-11
    title: Island views, one-command install
    summary: >-
      A smaller release: an easier way to install WhiteRose, and the centre island's views reworked so new ones are one file each.
    added:
      - "One command installs WhiteRose: it downloads both packages, checks their signature and installs them (install.sh, attached to every release)"
    changed:
      - "Each of the island's views (dock, clipboard, screenshots, launcher, switcher, the recovery prompt) is declared in its own file; the island sizes and morphs to whatever it shows"
    fixed:
      - "Installing just the whiterose package on its own stopped with a missing whiterose-core; the installer and the release notes now install the pair"
    contributors: [BlueBeard63]

  - version: 0.2.0
    date: 2026-11-11
    title: Files
    summary: >-
      The first WhiteRose release, and it ships two milestones at once:
      0.1 Foundations (the compositor, shell, Settings, Files and Notepad,
      signed updates, fingerprint unlock) and 0.2 Files.
    added:
      - "Files without dialogs: the Sheet beside your files holds info, renaming many at once, share and compress, connecting, and compare & sync"
      - "Cloud drives in Files: Google Drive, OneDrive, Dropbox, iCloud Drive, pCloud and S3 (through rclone), plus GNOME Online Accounts' drives"
      - "Nextcloud in Files: sync badges on every file, keep offline, free up space, share links"
      - "Network shares: SMB, SFTP, FTP, WebDAV and NFS, hosts from your SSH config, passwords in the keyring"
      - "Compare & sync folders, with the differences marked on the files in both panes"
      - "Your own actions in the right-click menu; search inside files; whiterose-files --find from a terminal"
    changed:
      - "Copies, moves and clashes go in an Activity drawer; questions ask in a strip above the files; new folders are named right where they appear"
      - "Settings asks in place too: questions as a strip, forms and a network's settings as their own page, a Wi-Fi password right under the network"
      - "Notepad asks about unsaved changes in a strip, and Go to line is a bar"
      - "A cleaner look: no chips, rows that don't change height, WhiteRose's own window controls"
      - "Files shows the git branch you're in; git itself stays in your terminal and editor"
    removed:
      - "The gallery view (pictures open as a grid of thumbnails)"
    contributors: [BlueBeard63]
