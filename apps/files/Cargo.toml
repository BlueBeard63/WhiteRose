[package]
name = "whiterose-files"
description = "WhiteRose Files: the file manager."
version.workspace = true
edition.workspace = true

[[bin]]
name = "whiterose-files"
path = "src/main.rs"

[dependencies]
whiterose-kit = { path = "../kit" }
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
json5 = "0.4"
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma"] }
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
bzip2 = "0.4"
zstd = "0.13"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"

[build-dependencies]
cxx-qt-build.workspace = true
