# WhiteRose's temporary folders in /tmp (installed as
# /usr/lib/tmpfiles.d/whiterose.conf). /tmp is usually RAM, so anything
# left there uses memory and ends up in swap.
#
# wr-*: the Files app's drawing folders (markdown diagrams and maths) and
# folders from WhiteRose's own test runs. Both remove themselves; this
# catches any left by a crash or a killed run. Only contents nobody has
# read or changed for a day are removed (systemd-tmpfiles-clean, daily).
e /tmp/wr-* - - - 1d
